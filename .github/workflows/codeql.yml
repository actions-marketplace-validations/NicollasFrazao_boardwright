name: CodeQL

on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: '17 6 * * 1'

permissions:
  contents: read

jobs:
  analyze:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: github/codeql-action/init@v4
        with:
          languages: javascript-typescript
          queries: security-and-quality
          # dist/ is the bundle of the sources CodeQL already analyzes, plus third-party code.
          config: |
            paths-ignore:
              - dist
      - uses: github/codeql-action/analyze@v4
        with:
          category: /language:javascript-typescript
