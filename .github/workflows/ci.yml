name: CI

on:
  push:
    branches: [master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The git hooks are for local commits; CI runs the checks as jobs.
  HUSKY: '0'

# One job per check, so each one can be a required status check on its own.
jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run typecheck

  architecture:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run check:architecture

  unused:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - run: npm run check:unused

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Tests with the 80% coverage gate
        run: npm run test:coverage
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: coverage
          path: coverage/
          retention-days: 14


  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Production dependencies, high severity and above
        run: npm audit --omit=dev --audit-level=high

  context:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26
      - name: Agent surfaces are copies of .context/docs/README.md
        run: npm run check:context

  action:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: dist/ is the build of the sources and of package-lock.json
        run: |
          npm run build:action
          changes="$(git status --porcelain --untracked-files=all -- dist)"
          if [ -n "$changes" ]; then
            echo "$changes"
            echo "::error::dist/ is out of date. Run npm run build:action and commit the result."
            exit 1
          fi
      # The Action, as a workflow runs it: Node 24, the agent packages fetched and checked against the
      # lockfile. The config does not exist, so the CLI exits 2 after the install; that is the expected end.
      - name: Run the Action
        id: smoke
        continue-on-error: true
        uses: ./
        with:
          github-token: not-a-token
          config: missing.config.yml
          dry-run: true
      - name: The Action installed the agent and reached the CLI
        env:
          OUTCOME: ${{ steps.smoke.outcome }}
        run: |
          test "$OUTCOME" = failure
          test -x dist/node_modules/@anthropic-ai/claude-agent-sdk-linux-x64/claude
          dist/node_modules/@anthropic-ai/claude-agent-sdk-linux-x64/claude --version
          node dist/cli.js --help > /dev/null
      - name: The npm package builds and packs
        run: |
          npm run build:npm
          npm pack ./build/npm --dry-run

  commitlint:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v7
        with:
          node-version: 26
          cache: npm
      - run: npm ci
      - name: Every commit of the pull request follows Conventional Commits
        run: >-
          npx commitlint
          --from ${{ github.event.pull_request.base.sha }}
          --to ${{ github.event.pull_request.head.sha }}
          --verbose
